[package]
name = "globalping-probe"
version = "0.53.0"
edition = "2024"
rust-version = "1.100"
description = "Rust rewrite of the globalping network measurement probe"
authors = ["Fyaz Manknojiya"]
license = "Apache-2.0"
repository = "https://github.com/codeandsolder/globalpingProbe-Rust"
keywords = ["network", "probe", "globalping", "measurement"]
categories = ["network-programming", "command-line-utilities"]

[features]
default = ["native"]
native = [
    "behavior-artifact",
    "dep:axum",
    "dep:futures-util",
    "dep:if-addrs",
    "dep:jiff",
    "dep:psl",
    "dep:rand",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:url",
    "dep:uuid",
    "dep:wasmtime",
    "dep:wreq",
]
behavior-artifact = [
    "dep:anyhow",
    "dep:ed25519-dalek",
    "dep:hex",
    "dep:semver",
    "dep:sha2",
]
wasm-core = []

[lints.rust]
unsafe_code = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[[bin]]
name = "globalping-probe"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "globalping-behavior-pack"
path = "src/bin/globalping-behavior-pack.rs"
required-features = ["behavior-artifact"]

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
required-features = ["native"]

[[test]]
name = "behavior_component"
path = "tests/behavior_component.rs"
required-features = ["native"]

[[bin]]
name = "globalping-sandbox"
path = "src/bin/globalping-sandbox.rs"
required-features = ["wasm-core"]

[dependencies]
tokio       = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"], optional = true }
anyhow        = { version = "1", optional = true }
tracing     = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"], optional = true }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
uuid        = { version = "1", features = ["v4"], optional = true }
jiff        = { version = "1", default-features = false, features = ["std"], optional = true }
futures-util  = { version = "0.3", features = ["sink"], optional = true }
wreq = { git = "https://github.com/codeandsolder/wreq-exp.git", rev = "032201ede57f9ff30455e2b4351f6cefb96d9bbd", features = ["json", "stream", "ws", "native-roots"], optional = true }
axum = { version = "0.8.9", optional = true }
rand = { version = "0.10", optional = true }
if-addrs = { version = "0.15.0", optional = true }
url = { version = "2.5.8", optional = true }
psl = { version = "2", optional = true }
ed25519-dalek = { version = "3", optional = true }
hex = { version = "0.4", optional = true }
semver = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
wasmtime = { version = "51", default-features = false, features = ["async", "component-model", "component-model-async", "cranelift", "runtime", "std"], optional = true }
globalping-behavior-core = { path = "crates/globalping-behavior-core" }

[dev-dependencies]
tempfile       = "3"
btls = { git = "https://github.com/codeandsolder/btls-fast.git", rev = "f6ae02c80ae54dfd3e59d7d440e616f523449cac" }
tokio-btls = { git = "https://github.com/codeandsolder/btls-fast.git", rev = "f6ae02c80ae54dfd3e59d7d440e616f523449cac" }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 0
debug = true

[workspace]
members = [".", "crates/globalping-behavior", "crates/globalping-behavior-core"]
default-members = ["."]
resolver = "2"
