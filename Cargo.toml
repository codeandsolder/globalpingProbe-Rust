[package]
name = "globalping-probe"
version = "0.48.0"
edition = "2024"
description = "Rust rewrite of the globalping network measurement probe"
authors = ["Fyaz Manknojiya"]
license = "Apache-2.0"
repository = "https://github.com/codeandsolder/globalpingProbe-Rust"
keywords = ["network", "probe", "globalping", "measurement"]
categories = ["network-programming", "command-line-utilities"]

[features]
default = ["native"]
native = [
    "dep:anyhow",
    "dep:axum",
    "dep:config",
    "dep:sha2",
    "dep:semver",
    "dep:hex",
    "dep:ed25519-dalek",
    "dep:futures",
    "dep:futures-util",
    "dep:if-addrs",
    "dep:psl",
    "dep:rand",
    "dep:reqwest",
    "dep:rust_socketio",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:url",
    "dep:uuid",
    "dep:wasmtime",
]
wasm-core = []

[lints.rust]
unsafe_code = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[[bin]]
name = "globalping-probe"
path = "src/main.rs"
required-features = ["native"]

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
required-features = ["native"]

[[test]]
name = "behavior_component"
path = "tests/behavior_component.rs"
required-features = ["native"]

[[bin]]
name = "globalping-sandbox"
path = "src/bin/globalping-sandbox.rs"
required-features = ["wasm-core"]

[dependencies]
tokio       = { version = "1", features = ["full"], optional = true }
anyhow        = { version = "1", optional = true }
tracing     = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"], optional = true }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
config      = { version = "0.14", optional = true }
uuid        = { version = "1", features = ["v4"], optional = true }
chrono      = { version = "0.4", features = ["serde"] }
ipnet       = "2"
regex       = "1"
futures     = { version = "0.3", optional = true }
futures-util  = { version = "0.3", optional = true }
rust_socketio = { version = "0.5", features = ["async"], optional = true }
reqwest       = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
axum = { version = "0.8.9", optional = true }
rand = { version = "0.9", optional = true }
if-addrs = { version = "0.15.0", optional = true }
url = { version = "2.5.8", optional = true }
psl = { version = "2", optional = true }
ed25519-dalek = { version = "2", optional = true }
hex = { version = "0.4", optional = true }
semver = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
wasmtime = { version = "49", default-features = false, features = ["async", "component-model", "component-model-async", "cranelift", "runtime", "std"], optional = true }

[dev-dependencies]
bytes         = "1"
tokio-test     = "0.4"
mockall        = "0.13"
assert_matches = "1.5"
tempfile       = "3"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 0
debug = true

[workspace]
members = [".", "crates/globalping-behavior"]
default-members = ["."]
resolver = "2"
