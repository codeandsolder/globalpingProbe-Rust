name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_WARNINGS: deny

jobs:
  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@16c9a26e94f40c8f0d706fa6d9a4d207c1e2e78a # main
    with:
      allow-test-panics: true

  stable:
    name: Rust 1.99
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@6b1adce9a7b2de91d50572fda04bed37c805f814 # main
        with:
          rust-toolchain: "1.99.1"
      - name: Toolchain versions
        run: |
          rustc +1.99.1 --version
          cargo +1.99.1 --version
      - name: Lockfile consistency
        run: cargo +1.99.1 metadata --locked --format-version 1 >/dev/null
      - name: Format
        run: cargo +1.99.1 fmt --all -- --check
      - name: Check all targets
        run: cargo +1.99.1 check --locked --all-targets
      - name: Clippy production targets
        run: cargo +1.99.1 clippy --locked --lib --bins -- -D warnings -D clippy::pedantic -D clippy::nursery
      - name: Unit tests
        run: cargo +1.99.1 test --locked --lib --bins
      - name: Documentation
        run: cargo +1.99.1 doc --locked --no-deps
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@6b1adce9a7b2de91d50572fda04bed37c805f814 # main
