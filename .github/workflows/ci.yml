name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_WARNINGS: deny

jobs:
  rust-skills2-strict:
    name: rust-skills2 strict nightly gate
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@main
    with:
      cargo-args: --locked --workspace --exclude globalping-behavior --all-targets
      allow-test-panics: true

  stable:
    name: Rust 1.99
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Install WASIp2 target
        run: rustup target add wasm32-wasip2 --toolchain 1.99.0
      - name: Toolchain versions
        run: |
          rustc +1.99.0 --version
          cargo +1.99.0 --version
      - name: Lockfile consistency
        run: cargo +1.99.0 metadata --locked --format-version 1 >/dev/null
      - name: Format
        run: cargo +1.99.0 fmt --all -- --check
      - name: Check all targets
        run: cargo +1.99.0 check --locked --all-targets
      - name: Build WASIp2 sandbox component
        run: cargo +1.99.0 build --locked --release --no-default-features --features wasm-core --bin globalping-sandbox --target wasm32-wasip2
      - name: Build WASIp2 behavior component
        run: cargo +1.99.0 build --locked --release -p globalping-behavior --target wasm32-wasip2
      - name: Package signed behavior update artifact
        run: |
          # Deterministic public CI-only seed. Production signing material never enters the probe runtime.
          printf '47%.0s' {1..32} | cargo +1.99.0 run --locked --no-default-features --features behavior-artifact --bin globalping-behavior-pack -- \
            --component target/wasm32-wasip2/release/globalping_behavior.wasm \
            --output-dir target/ci-behavior-artifact \
            --sequence 1 \
            --build-id ci-${GITHUB_SHA} \
            --signing-key -
          test -f target/ci-behavior-artifact/manifest.json
          test -f target/ci-behavior-artifact/component.wasm
          test "$(find target/ci-behavior-artifact -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Verify signed behavior runtime and shadow executor
        env:
          GLOBALPING_BEHAVIOR_COMPONENT: target/wasm32-wasip2/release/globalping_behavior.wasm
        run: cargo +1.99.0 test --locked --test behavior_component -- --include-ignored
      - name: Differential-test all WASIp2 measurement behavior against native shaping
        env:
          GLOBALPING_BEHAVIOR_COMPONENT: target/wasm32-wasip2/release/globalping_behavior.wasm
        run: cargo +1.99.0 test --locked --lib differential_tests::differential_ -- --ignored
      - name: Clippy production targets
        run: cargo +1.99.0 clippy --locked --lib --bins -- -D warnings -D clippy::pedantic -D clippy::nursery
      - name: Clippy shared behavior core
        run: cargo +1.99.0 clippy --locked -p globalping-behavior-core -- -D warnings -D clippy::pedantic -D clippy::nursery
      - name: Clippy WASIp2 behavior component
        run: cargo +1.99.0 clippy --locked -p globalping-behavior --target wasm32-wasip2 -- -D warnings -D clippy::pedantic -D clippy::nursery
      - name: Unit tests
        run: cargo +1.99.0 test --locked --lib --bins
      - name: Shared behavior core unit tests
        run: cargo +1.99.0 test --locked -p globalping-behavior-core
      - name: Documentation
        run: cargo +1.99.0 doc --locked --no-deps
