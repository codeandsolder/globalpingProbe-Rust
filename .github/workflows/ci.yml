name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@b4404e640d29aac6a804df9b647e5d25c8c64173 # main
    with:
      cargo-args: --locked --workspace --exclude globalping-behavior --all-targets
      allow-test-panics: true

  stable:
    name: Rust 1.99 + WASIp2
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@18397eb8f0bd8a76f90010a66a8519011f7992ca # main
    with:
      rust-toolchain: "1.99.0"
      rust-components: rustfmt clippy
      rust-targets: wasm32-wasip2
      rustflags: ""
      runner: ubuntu-26.04
      timeout-minutes: 30
      command: |
        set -euo pipefail
        export CARGO_BUILD_WARNINGS=deny

        cargo +1.99.0 metadata --locked --format-version 1 >/dev/null
        cargo +1.99.0 fmt --all -- --check
        cargo +1.99.0 check --locked --all-targets

        cargo +1.99.0 build --locked --release --no-default-features --features wasm-core --bin globalping-sandbox --target wasm32-wasip2
        cargo +1.99.0 build --locked --release -p globalping-behavior --target wasm32-wasip2

        # Deterministic public CI-only seed. Production signing material never enters the probe runtime.
        printf '47%.0s' {1..32} | cargo +1.99.0 run --locked --no-default-features --features behavior-artifact --bin globalping-behavior-pack -- \
          --component "$CARGO_TARGET_DIR/wasm32-wasip2/release/globalping_behavior.wasm" \
          --output-dir "$CARGO_TARGET_DIR/ci-behavior-artifact" \
          --sequence 1 \
          --build-id "ci-${GITHUB_SHA}" \
          --signing-key -
        test -f "$CARGO_TARGET_DIR/ci-behavior-artifact/manifest.json"
        test -f "$CARGO_TARGET_DIR/ci-behavior-artifact/component.wasm"
        test "$(find "$CARGO_TARGET_DIR/ci-behavior-artifact" -maxdepth 1 -type f | wc -l)" -eq 2

        GLOBALPING_BEHAVIOR_COMPONENT="$CARGO_TARGET_DIR/wasm32-wasip2/release/globalping_behavior.wasm" \
          cargo +1.99.0 test --locked --test behavior_component -- --include-ignored
        GLOBALPING_BEHAVIOR_COMPONENT="$CARGO_TARGET_DIR/wasm32-wasip2/release/globalping_behavior.wasm" \
          cargo +1.99.0 test --locked --lib differential_tests::differential_ -- --ignored

        cargo +1.99.0 clippy --locked --lib --bins -- -D warnings -D clippy::pedantic -D clippy::nursery
        cargo +1.99.0 clippy --locked -p globalping-behavior-core -- -D warnings -D clippy::pedantic -D clippy::nursery
        cargo +1.99.0 clippy --locked -p globalping-behavior --target wasm32-wasip2 -- -D warnings -D clippy::pedantic -D clippy::nursery
        cargo +1.99.0 clippy --locked -p globalping-behavior --target wasm32-wasip2 --features post-start-fault-fixture -- -D warnings -D clippy::pedantic -D clippy::nursery
        cargo +1.99.0 clippy --locked -p globalping-behavior --target wasm32-wasip2 --features post-start-divergence-fixture -- -D warnings -D clippy::pedantic -D clippy::nursery
        cargo +1.99.0 clippy --locked -p globalping-behavior --target wasm32-wasip2 --features post-start-invalid-output-fixture -- -D warnings -D clippy::pedantic -D clippy::nursery
        cargo +1.99.0 clippy --locked -p globalping-behavior --target wasm32-wasip2 --features pre-completion-final-fixture -- -D warnings -D clippy::pedantic -D clippy::nursery

        cargo +1.99.0 test --locked --lib --bins
        cargo +1.99.0 test --locked -p globalping-behavior-core
        cargo +1.99.0 doc --locked --no-deps
